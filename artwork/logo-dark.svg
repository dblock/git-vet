  <defs>
    <style>
      @keyframes svet-toggle {
        0%,
        42%,
        100% {
          transform: translateY(0);
        }
        50%,
        92% {
          transform: translateY(12px);
        }
      }
      @keyframes svet-light {
        0%,
        42%,
        100% {
          opacity: 1;
        }
        50%,
        92% {
          opacity: 0;
        }
      }
      @keyframes svet-bulb {
        0%,
        42%,
        100% {
          fill: #ffe79b;
        }
        50%,
        92% {
          fill: #dde5dd;
        }
      }
      .svet-toggle {
        animation: svet-toggle 4s ease-in-out infinite;
      }
      .svet-light {
        animation: svet-light 4s ease-in-out infinite;
      }
      .svet-bulb {
        animation: svet-bulb 4s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .svet-toggle,
        .svet-light,
        .svet-bulb {
          animation: none;
        }
      }
    </style>
